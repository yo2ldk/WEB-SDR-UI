<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebSDR</title>
<style>
:root{--bg:#0a0f1e;--p:#121a33;--l:#243056;--t:#dbe4ff;--a:#4da3ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
header,section{padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header{background:var(--p);border-bottom:1px solid var(--l)}
button,select,input{background:var(--l);color:var(--t);border:1px solid #34437a;border-radius:6px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:hover,.on{background:var(--a);color:#001}
#f{font:600 30px ui-monospace,monospace;color:var(--a);width:210px;background:#000;text-align:right}
canvas{width:100%;display:block;cursor:crosshair}#sp{height:140px;background:#050a18}#wf{height:360px}#split{height:9px;background:var(--l);cursor:ns-resize;touch-action:none;display:flex;align-items:center;justify-content:center}#split::after{content:"";width:60px;height:3px;border-radius:2px;background:#5b6fb0}#split:hover{background:#34437a}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px}.chips button{padding:3px 8px;font-size:12px}
.chips b{width:100%;font-size:11px;opacity:.6;margin-top:4px}#st{color:#7fe3a0;font-weight:600}
label{font-size:12px;opacity:.85}input[type=range]{padding:0;width:110px}
.g{display:none;gap:10px;align-items:center}.g.show{display:flex}
#wfc{margin-left:auto;position:relative;display:flex;gap:6px}
#pop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:8px 14px;display:none;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 20px #0008}
#pop.show{display:flex}#pv{font-size:12px;white-space:nowrap}
input.vs{writing-mode:vertical-lr;direction:rtl;width:26px;height:140px;padding:0;display:none}input.vs.show{display:block}
.chips .tabs{width:100%;display:flex;gap:6px;margin-bottom:2px}.chips .tabs button{font-size:13px;padding:4px 14px}
.grp{display:flex;flex-wrap:wrap;gap:4px;width:100%}.grp[hidden]{display:none}
#tools{display:flex;gap:8px;padding:6px 12px}#tools>div{flex:1;min-width:0;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:6px}#tools [hidden]{display:none}
.ph{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:4px;flex-wrap:wrap}.cv{position:relative;height:150px}.cv canvas{position:absolute;left:0;top:0;width:100%;height:150px;cursor:default}#aul{pointer-events:auto;touch-action:none}
#dtx{height:120px;overflow:auto;font:13px ui-monospace,monospace;white-space:pre-wrap;background:#050a18;padding:6px;border-radius:6px;color:#9fe}#rtp{display:none;gap:6px;align-items:center}#rtp.show{display:flex}#rtp input[type=number]{width:70px}
#rps{font:700 30px ui-monospace,monospace;color:#ffc828;letter-spacing:2px;min-height:38px}#rrt{font:13px ui-monospace,monospace;color:#9fe;min-height:34px;white-space:pre-wrap}
#rtc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}.rb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.vr{display:flex;gap:12px;align-items:center}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
#ftp{display:none}#ftp.show{display:inline-flex;gap:6px;align-items:center}
#dcw{position:relative}#dmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:150px;box-shadow:0 8px 24px #000a}#dmenu[hidden]{display:none}#dmenu button{text-align:left;border:0;background:transparent;padding:6px 10px}#dmenu button:hover,#dmenu button.on{background:var(--a);color:#001}#dk{display:none}#dname{color:#50e6ff}
#sm{position:fixed;right:24px;top:150px;width:360px;height:270px;min-width:300px;min-height:180px;max-width:96vw;max-height:90vh;resize:both;overflow:hidden;z-index:40;background:#14161c;border:1px solid #3a4260;border-radius:10px;box-shadow:0 10px 30px #000a;display:flex;flex-direction:column}#sm[hidden]{display:none}
#smh{display:flex;gap:6px;align-items:center;padding:4px 8px;cursor:move;background:var(--l);font-size:12px;user-select:none;white-space:nowrap;overflow:hidden}#smh select,#smh button,#smh input{font-size:12px;padding:2px 6px}#smv{flex:1;min-height:0;width:100%;display:block}#smt{padding:3px 8px;font:12px ui-monospace,monospace;text-align:center;color:#ffd666}
</style></head><body>
<header>
 <select id="src"><option value="demo">Demo (simulat)</option><option value="rtl">RTL-SDR (WebUSB direct, R820T)</option><option value="as">Airspy R2/Mini (WebUSB direct)</option><option value="hrf">HackRF (WebUSB direct)</option><option value="ws">WebSocket IQ (rtl_tcp / HackRF / RSP1 / bridge)</option></select>
 <input id="url" value="ws://localhost:8080" size="20"><select id="fmt"><option value="u8">u8 (RTL-SDR)</option><option value="s8">s8 (HackRF)</option><option value="f32">f32</option></select>
 <input id="rate" type="number" value="2048000" style="width:100px" title="sample rate (efectiv). RTL-SDR: 225001–300000 sau 900001–3200000 · HackRF: se rulează intern la ≥8 MS/s și se decimează">
 <button id="go">▶ Start</button><input id="f" value="7074.000" title="ex: 7074k · 100.6m (fără sufix = unitatea afișată)"> <label id="fu">kHz</label>
 <span>
  <button data-m="AM">AM</button><button data-m="USB">USB</button><button data-m="LSB">LSB</button><button data-m="CW">CW</button><button data-m="NFM">NFM</button><button data-m="WFM">WFM</button><button data-m="DSB">DSB</button>
 </span>
 <span id="bwl"></span><span id="clip" style="color:#ff7b7b;font-weight:600"></span><span id="dbg" style="font-size:11px;opacity:.85"></span><span id="rtc"><span class="rb"><button id="aub">Audio</button><span id="dcw"><button id="dcb">Decoder ▾</button><div id="dmenu" hidden><button data-d="none" class="on">— niciunul —</button><button data-d="cw">CW</button><button data-d="rtty">RTTY</button><button data-d="psk">PSK31</button><button data-d="aprs">APRS 1200</button><button data-d="ft8">FT8</button></div></span><button id="nbb" title="Noise blanker (zgomot impulsiv: PC, USB, LED-uri)">NB</button><button id="rdb" title="Decodor RDS (modul WFM)">RDS</button><button id="smb" title="S-metru analogic (mutabil și redimensionabil)">S-metru</button></span><span class="vr"><label>Vol <input id="vol" type="range" min="0" max="2" step=".05" value="1"></label><span id="utc"></span></span></span>
</header>
<section>
 <span class="g" id="g-rtl"><label>RTL gain <input id="rtg" type="range" min="0" max="49" value="25"></label><label><input id="rta" type="checkbox" checked> Auto</label></span>
 <span class="g" id="g-as"><label>Airspy gain <input id="asg" type="range" min="0" max="21" value="12"></label></span>
 <span class="g" id="g-hrf"><label>LNA <input id="lna" type="range" min="0" max="40" step="8" value="24"></label><label>VGA <input id="vga" type="range" min="0" max="62" step="2" value="20"></label><label><input id="amp" type="checkbox"> Amp</label></span>
 <label>EiBi CSV <input id="eibi" type="file" accept=".csv,.txt"></label>
 <label title="Offset upconverter (MHz): frecvența afișată = frecvența tunerului + offset. Ex: -125 (Ham It Up), -100, -120 (SpyVerter)">Offset <input id="ofs" type="text" inputmode="decimal" value="0" style="width:84px;text-align:right"> MHz</label><label title="Inversează spectrul (I/Q), pentru convertoare cu LO deasupra frecvenței"><input id="inv" type="checkbox"> Inv</label>
 <span id="st">—</span>
 <span id="wfc"><button data-w="fl">Floor</button><button data-w="rg">Range</button>
  <div id="pop"><span id="pv"></span><input id="fl" class="vs" type="range" min="-120" max="-20" value="-85"><input id="rg" class="vs" type="range" min="20" max="100" value="55"></div></span>
</section>
<canvas id="sp" width="2048" height="140"></canvas>
<div id="split" title="trage sus/jos pentru a redimensiona"></div>
<canvas id="wf" width="2048" height="360"></canvas>
<div id="tools">
 <div id="aup" hidden><div class="ph">Spectrogramă audio (frecvența selectată)</div><div class="cv"><canvas id="au" width="900" height="150"></canvas><canvas id="aul" width="900" height="150"></canvas></div></div>
 <div id="decp" hidden><div class="ph"><b id="dname"></b><select id="dk"><option value="cw">CW</option><option value="rtty">RTTY</option><option value="psk">PSK31</option><option value="aprs">APRS 1200</option><option value="ft8">FT8</option></select>
  <span id="rtp"><label>Shift <select id="rts"><option>170</option><option>425</option><option>850</option></select></label><label>Bd <select id="rtb"><option>45.45</option><option>50</option><option>75</option></select></label><label><input id="rtr" type="checkbox"> Rev</label></span>
  <span id="ftp"><label>Bandă FT8 <select id="ft8f"><option value="">— alege —</option><option value="1.84">160m  1.840 MHz</option><option value="3.573">80m  3.573 MHz</option><option value="5.357">60m  5.357 MHz</option><option value="7.074">40m  7.074 MHz</option><option value="10.136">30m  10.136 MHz</option><option value="14.074">20m  14.074 MHz</option><option value="18.1">17m  18.100 MHz</option><option value="21.074">15m  21.074 MHz</option><option value="24.915">12m  24.915 MHz</option><option value="28.074">10m  28.074 MHz</option><option value="50.313">6m  50.313 MHz</option><option value="144.174">2m  144.174 MHz</option></select></label></span><span id="dinfo"></span><button id="dclr">Clear</button></div><div id="dtx"></div></div>
 <div id="rdsp" hidden><div class="ph"><b>RDS</b><span id="rinfo"></span><button id="rclr">Reset</button></div><div id="rps"></div><div id="rrt"></div></div>
</div>
<div class="chips" id="bands"></div>
<div id="sm" hidden><div id="smh"><b>S-metru</b><select id="sms"><option value="s">S (S1–S9+dB)</option><option value="dbm">dBm</option><option value="w">Watt</option><option value="v">µV / mV</option></select><button id="smc" title="Setează S9 = nivelul curent (calibrare)">S9=acum</button><label title="Calibrare: dBm = nivel în dBFS + offset">Cal <input id="smo" type="text" value="-30" style="width:48px;text-align:right"> dB</label><button id="smx" title="Închide">✕</button></div><canvas id="smv"></canvas><div id="smt"></div></div>
